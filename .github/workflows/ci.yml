# ============================================================
# CI — 타입 체크 + 린트 + 단위 테스트
# Push / PR → main, develop 브랜치에서 실행
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ── 타입스크립트 타입 체크 ──────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: "mysql://root:rootpassword@localhost:3306/energy"

      - name: TypeScript type check
        run: pnpm tsc --noEmit

  # ── 린트 ─────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  # ── 단위 테스트 ───────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: energy_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: "mysql://root:rootpassword@localhost:3306/energy_test"
      NEXTAUTH_SECRET: "ci-test-secret-32-chars-minimum-ok"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run DB migrations (test DB)
        run: pnpm prisma migrate deploy

      - name: Run unit tests
        run: pnpm test --passWithNoTests

  # ── Python AI Engine ─────────────────────────────────────
  ai-engine-test:
    name: AI Engine Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short || true

  # ── Docker 빌드 검증 ─────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Next.js image (dry run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ems-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI Engine image (dry run)
        uses: docker/build-push-action@v5
        with:
          context: ./ai-engine
          push: false
          tags: ems-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
