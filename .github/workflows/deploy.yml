# ============================================================
# CD — 프로덕션 배포
# main 브랜치 push 또는 수동 트리거 시 실행
# ============================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: '배포 환경'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/${{ github.repository }}/app
  IMAGE_AI: ghcr.io/${{ github.repository }}/ai-engine

jobs:
  # ── 이미지 빌드 & 푸시 ───────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      app-tag: ${{ steps.meta-app.outputs.tags }}
      ai-tag: ${{ steps.meta-ai.outputs.tags }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "value=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Next.js 이미지 메타
      - name: Extract metadata (Next.js)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_APP }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # AI Engine 이미지 메타
      - name: Extract metadata (AI Engine)
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_AI }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Next.js 빌드 & 푸시
      - name: Build & push Next.js image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # AI Engine 빌드 & 푸시
      - name: Build & push AI Engine image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-engine
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 프로덕션 배포 ─────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-push
    environment: ${{ github.event.inputs.environment || 'production' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_TAG: ${{ needs.build-push.outputs.version }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: APP_TAG
          script: |
            set -e
            cd /opt/ems-aiot

            # 최신 코드 pull (compose 파일 & infra 설정만)
            git pull origin main

            # 이미지 pull
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_APP }}:$APP_TAG
            docker pull ${{ env.IMAGE_AI }}:$APP_TAG

            # docker-compose.yml의 이미지 태그 업데이트
            sed -i "s|image: .*ems-app:.*|image: ${{ env.IMAGE_APP }}:$APP_TAG|g" docker-compose.override.yml || true
            sed -i "s|image: .*ems-ai:.*|image: ${{ env.IMAGE_AI }}:$APP_TAG|g" docker-compose.override.yml || true

            # DB 마이그레이션 (무중단)
            docker compose run --rm --no-deps app1 npx prisma migrate deploy

            # Rolling restart (무중단)
            docker compose up -d --no-deps --scale app1=1 app1
            sleep 15
            docker compose up -d --no-deps --scale app2=1 app2
            sleep 15

            # AI Engine 재시작
            docker compose up -d --no-deps ai-engine

            # 헬스 체크
            for i in $(seq 1 12); do
              status=$(curl -sf http://localhost/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
              if [ "$status" = "ok" ]; then
                echo "✅ Health check passed"
                exit 0
              fi
              echo "⏳ Waiting... ($i/12)"
              sleep 10
            done
            echo "❌ Health check failed"
            exit 1

      - name: Notify deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const version = '${{ needs.build-push.outputs.version }}';
            console.log(`${emoji} Deployment ${status} — version: ${version}`);
