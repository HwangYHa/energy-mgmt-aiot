version: '3.8'

# ===============================
# 🔄 전체 데이터 흐름
# IoT Sensor
#    ↓ MQTT
# EMQX Broker
#    ↓
# API Server
#    ↓
# TimescaleDB ← Redis
#    ↓
# AI Engine (분석)
#    ↓
# Web Dashboard
# ===============================

services:
  # ===============================
  # PostgreSQL with TimescaleDB
  # ===============================
  # 역할
  # - 센서 시계열 데이터 저장
  # - 전력, 온도, 습도, 부하 등 시간 기반 데이터에 최적화
  #
  # 주요 설정
  # - DB 이름: ems_dev
  # - 유저: ems
  # - 비밀번호: .env 에서 관리
  # - 포트: 5432 (로컬 DB 툴 접속 가능)
  #
  # 초기 SQL:
  # - ./infra/docker/postgres/init.sql
  #   → extension / hypertable / seed 데이터
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ems-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ems_dev
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # → API가 DB 준비될 때까지 기다리게 함 (중요)
      test: ["CMD-SHELL", "pg_isready -U ems -d ems_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems-network

  # ===============================
  # Redis
  # ===============================
  # 역할
  # - 캐시
  # - 세션 / 토큰
  # - 실시간 데이터 버퍼
  # - MQTT → API 중간 버퍼
  #
  # 특징
  # - appendonly yes → 장애 시 데이터 유실 방지
  # - 포트 6379 로컬 접근 가능
  redis:
    image: redis:7-alpine
    container_name: ems-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ems-network

  # ===============================
  # MQTT Broker (EMQX)
  # ===============================
  # 역할 (핵심)
  # - IoT 디바이스 통신 허브
  # - 센서 → 서버 데이터 수집
  # - 서버 → 디바이스 제어
  #
  # Dashboard
  # - http://localhost:18083
  # - ID / PW 는 .env 에서 관리
  mqtt:
    image: emqx/emqx:5.4.0
    container_name: ems-mqtt
    env_file:
      - .env
    ports:
      - "1883:1883"    # MQTT
      - "8883:8883"    # MQTT + SSL
      - "8083:8083"    # WebSocket
      - "18083:18083"  # Dashboard
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: mqtt
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD__DEFAULT_PASSWORD}
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks:
      - ems-network

  # ===============================
  # API Server
  # ===============================
  # 역할
  # - 비즈니스 로직 중심
  # - 인증 / 사용자 / 장비 관리
  # - DB, Redis, MQTT 연결 허브
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ems-api
    env_file:
      - .env
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      # 비밀번호 특수문자 URL 인코딩 적용
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MQTT_URL: ${MQTT_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: pnpm dev
    networks:
      - ems-network

  # ===============================
  # Web Frontend (Next.js)
  # ===============================
  # 역할
  # - EMS 대시보드
  # - 실시간 전력 / 센서 데이터 시각화
  # - 알람 / 리포트
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: ems-web
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: pnpm dev
    networks:
      - ems-network

  # ===============================
  # AI Engine (선택)
  # ===============================
  # 역할
  # - 에너지 사용량 예측
  # - 이상 탐지
  # - 부하 최적화 추천
  #
  # 실행:
  # docker-compose --profile ai up
  ai-engine:
    build:
      context: ./apps/ai-engine
      dockerfile: Dockerfile
    container_name: ems-ai
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ems:dev123%21%40%23@postgres:5432/ems_dev
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/ai-engine:/app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ems-network
    profiles:
      - ai

volumes:
  postgres_data:
  redis_data:
  emqx_data:
  emqx_log:

networks:
  ems-network:
    driver: bridge
