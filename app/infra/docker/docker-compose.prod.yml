version: '3.8'

# ===============================
# 🚀 프로덕션 환경 Docker Compose
# ===============================

networks:
  ems-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  emqx_data:
    driver: local
  emqx_log:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  letsencrypt:
    driver: local

services:
  # ===============================
  # Nginx (Reverse Proxy + HTTPS)
  # ===============================
  nginx:
    image: nginx:alpine
    container_name: ems-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks:
      - ems-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===============================
  # PostgreSQL + TimescaleDB
  # ===============================
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ems-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ems_prod}
      POSTGRES_USER: ${POSTGRES_USER:-ems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # 성능 튜닝
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/timescale-setup.sql:/docker-entrypoint-initdb.d/02-timescale.sql:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems} -d ${POSTGRES_DB:-ems_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===============================
  # Redis
  # ===============================
  redis:
    image: redis:7-alpine
    container_name: ems-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfilename appendonly.aof
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ems-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===============================
  # MQTT Broker (EMQX)
  # ===============================
  mqtt:
    image: emqx/emqx:5.4.0
    container_name: ems-mqtt
    restart: always
    ports:
      - "1883:1883"     # MQTT
      - "8883:8883"     # MQTT SSL
      - "8083:8083"     # WebSocket
      - "18083:18083"   # Dashboard
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: mqtt
      EMQX_CLUSTER__DISCOVERY_STRATEGY: static
      EMQX_CLUSTER__STATIC__SEEDS: 'emqx@mqtt'
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      EMQX_LOADED_PLUGINS: "emqx_dashboard,emqx_management,emqx_auth_mnesia"
      # 성능 튜닝
      EMQX_LISTENER__TCP__EXTERNAL__MAX_CONNECTIONS: 1024000
      EMQX_LISTENER__TCP__EXTERNAL__ACCEPTORS: 16
      EMQX_MQTT__MAX_PACKET_SIZE: 1MB
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===============================
  # API Server (NestJS)
  # ===============================
  api:
    image: ${REGISTRY:-ghcr.io/yourorg}/ems-api:${VERSION:-latest}
    container_name: ems-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ems}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ems_prod}
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mqtt:1883
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://ems.example.com}
      # Sentry (선택)
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ems-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===============================
  # Web Frontend (Next.js)
  # ===============================
  web:
    image: ${REGISTRY:-ghcr.io/yourorg}/ems-web:${VERSION:-latest}
    container_name: ems-web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.ems.example.com}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://ems.example.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ems-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===============================
  # Monitoring: Prometheus
  # ===============================
  prometheus:
    image: prom/prometheus:latest
    container_name: ems-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - ems-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===============================
  # Monitoring: Grafana
  # ===============================
  grafana:
    image: grafana/grafana:latest
    container_name: ems-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.ems.example.com}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - ems-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===============================
  # AI Engine (FastAPI) - Optional
  # ===============================
  ai-engine:
    image: ${REGISTRY:-ghcr.io/yourorg}/ems-ai:${VERSION:-latest}
    container_name: ems-ai
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ems}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ems_prod}
      REDIS_URL: redis://redis:6379
      MODEL_PATH: /app/models
    volumes:
      - ./ai-models:/app/models:ro
    depends_on:
      - postgres
      - redis
    networks:
      - ems-network
    profiles:
      - ai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"