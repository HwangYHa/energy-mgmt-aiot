# ─── 탄소이음 Collector Service 설정 ─────────────────────────────────
# 이 파일을 config.yaml로 복사하여 실제 값을 채우세요.
#
# ★ OTA 권장 모드 (플랫폼 연동):
#   cloud 섹션의 gateway_id + gateway_token만 설정하면
#   장치 목록이 플랫폼에서 자동으로 내려옵니다.
#   devices 섹션은 오프라인 폴백 용도로만 사용됩니다.
#
# ★ 수동 모드 (플랫폼 미사용):
#   devices 섹션에 직접 장치를 정의하세요.

# ── Cloud SaaS 연결 ────────────────────────────────────────────────
cloud:
  api_url: "http://49.50.130.189"          # 탄소이음 플랫폼 URL
  gateway_id: "gw_xxxxxxxxxxxxxxxx"        # 이 게이트웨이의 고유 ID (플랫폼에서 확인)
  gateway_token: "your-gateway-token"      # 인증 토큰 (플랫폼 → 게이트웨이 → 설치파일 다운로드에서 자동 포함)
  sync_interval_sec: 10                    # 클라우드 동기화 주기 (초)
  heartbeat_interval_sec: 30              # 하트비트 전송 주기
  batch_size: 500                          # 1회 전송 최대 레코드 수
  timeout_sec: 15                          # HTTP 요청 타임아웃
  max_retries: 5                           # 최대 재시도 횟수

# ── 로컬 버퍼 ─────────────────────────────────────────────────────
buffer:
  db_path: "data/collector_buffer.db"      # SQLite 파일 경로
  max_records: 500000                      # 최대 보관 레코드 수
  retention_hours: 72                      # 미전송 데이터 보관 시간 (3일)

# ── 수집 엔진 ─────────────────────────────────────────────────────
engine:
  max_workers: 20                          # 동시 폴링 스레드 수
  default_poll_interval_ms: 5000          # 기본 폴링 주기 (ms)
  connection_timeout_sec: 10              # 장치 연결 타임아웃
  reconnect_delay_sec: 30                 # 재연결 대기 시간

# ── 로깅 ──────────────────────────────────────────────────────────
logging:
  level: "INFO"                            # DEBUG | INFO | WARNING | ERROR
  file: "logs/collector.log"
  max_bytes: 10485760                      # 10MB
  backup_count: 5

# ── 장치 목록 (OTA 모드에서는 불필요 — 플랫폼에서 자동 로드) ────────
#
# OTA 연결 성공 시: 플랫폼 DB의 장치가 이 섹션을 대체합니다.
# OTA 연결 실패 시: 마지막 캐시(data/ota_config_cache.json) 사용.
# 캐시도 없을 때: 아래 devices 섹션을 마지막 폴백으로 사용합니다.
