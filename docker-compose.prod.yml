# ============================================================
# 탄소이음 EMS AIoT — 프로덕션 Standalone Compose
# 사용: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# 필수 사전 조건:
#   - /opt/ems-data/mysql, /opt/ems-data/redis 디렉토리 생성
#   - .env.production 파일 배치 (git 미포함)
#   - NCP Container Registry 로그인: docker login ${NCP_REGISTRY}
#
# 이미지 출처: NCP Container Registry
#   NCP_REGISTRY=carbonieum-ems-aiot.kr.ncr.ntruss.com
#   APP_VERSION=<git short SHA>
# ============================================================

version: '3.9'

networks:
  ems_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/ems-data/mysql
      o: bind
  redis_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/ems-data/redis
      o: bind
  mqtt_data:
  mqtt_logs:
  grafana_data:
  prometheus_data:
  certbot_www:
  certbot_conf:

services:
  # ── MySQL 8.0 ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ems_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-energy}
      MYSQL_USER: ${MYSQL_USER:-ems}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./infra/mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    expose:
      - "3306"
    networks:
      - ems_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max_connections=300
      --innodb_buffer_pool_size=1G
      --innodb_buffer_pool_instances=2
      --slow_query_log=ON
      --long_query_time=2
      --log_bin=mysql-bin
      --binlog_format=ROW
      --expire_logs_days=7
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Redis 7 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ems_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfilename appendonly.aof
      --save 3600 1 300 100 60 10000
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - ems_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ── MQTT Broker ───────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: ems_mqtt
    restart: always
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    expose:
      - "1883"
      - "9001"
    networks:
      - ems_net
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883",
             "-u", "${MQTT_USERNAME}", "-P", "${MQTT_PASSWORD}",
             "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── DB 마이그레이션 (배포 시 1회 실행, 앱 컨테이너보다 먼저) ──
  migrate:
    image: ${NCP_REGISTRY}/ems-app:${APP_VERSION:-latest}
    container_name: ems_migrate
    restart: "no"
    command: ["npx", "--yes", "prisma@5.22.0", "migrate", "deploy"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-ems}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-energy}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ems_net

  # ── DB 시딩 (마이그레이션 후 1회 실행) ──────────────────────
  #   실행: docker compose -f docker-compose.prod.yml run --rm seeder
  #   강제 비밀번호 재설정: SEED_FORCE_RESET=true docker compose ... run --rm seeder
  seeder:
    image: ${NCP_REGISTRY}/ems-seeder:${APP_VERSION:-latest}
    container_name: ems_seeder
    restart: "no"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-ems}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-energy}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@carbonieum.co.kr}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Carbonieum2026!}
      SEED_FORCE_RESET: ${SEED_FORCE_RESET:-false}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ems_net

  # ── Next.js App 1 (Blue) ──────────────────────────────────
  app1:
    image: ${NCP_REGISTRY}/ems-app:${APP_VERSION:-latest}
    container_name: ems_app1
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-ems}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-energy}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MQTT_BROKER_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_CLIENT_ID: ems-app1
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      WEB_APP_URL: ${WEB_APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI:-}
      AI_ENGINE_URL: http://ai-engine:8001
      CRON_SECRET: ${CRON_SECRET}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SECURITY_ALERT_EMAIL: ${SECURITY_ALERT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      NEXT_PUBLIC_TOSS_CLIENT_KEY: ${NEXT_PUBLIC_TOSS_CLIENT_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_BASIC_MONTHLY_PRICE_ID: ${STRIPE_BASIC_MONTHLY_PRICE_ID:-}
      STRIPE_BASIC_YEARLY_PRICE_ID: ${STRIPE_BASIC_YEARLY_PRICE_ID:-}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${STRIPE_PRO_MONTHLY_PRICE_ID:-}
      STRIPE_PRO_YEARLY_PRICE_ID: ${STRIPE_PRO_YEARLY_PRICE_ID:-}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_SENDER_PHONE: ${SOLAPI_SENDER_PHONE:-}
      KAKAO_SENDER_KEY: ${KAKAO_SENDER_KEY:-}
      SOLAPI_KAKAO_CHANNEL_ID: ${SOLAPI_KAKAO_CHANNEL_ID:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
      NEXT_PUBLIC_COMMIT_SHA: ${APP_VERSION:-unknown}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - ems_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Next.js App 2 (Green) ─────────────────────────────────
  app2:
    image: ${NCP_REGISTRY}/ems-app:${APP_VERSION:-latest}
    container_name: ems_app2
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-ems}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-energy}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MQTT_BROKER_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_CLIENT_ID: ems-app2
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      WEB_APP_URL: ${WEB_APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI:-}
      AI_ENGINE_URL: http://ai-engine:8001
      CRON_SECRET: ${CRON_SECRET}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SECURITY_ALERT_EMAIL: ${SECURITY_ALERT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      NEXT_PUBLIC_TOSS_CLIENT_KEY: ${NEXT_PUBLIC_TOSS_CLIENT_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_BASIC_MONTHLY_PRICE_ID: ${STRIPE_BASIC_MONTHLY_PRICE_ID:-}
      STRIPE_BASIC_YEARLY_PRICE_ID: ${STRIPE_BASIC_YEARLY_PRICE_ID:-}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${STRIPE_PRO_MONTHLY_PRICE_ID:-}
      STRIPE_PRO_YEARLY_PRICE_ID: ${STRIPE_PRO_YEARLY_PRICE_ID:-}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_SENDER_PHONE: ${SOLAPI_SENDER_PHONE:-}
      KAKAO_SENDER_KEY: ${KAKAO_SENDER_KEY:-}
      SOLAPI_KAKAO_CHANNEL_ID: ${SOLAPI_KAKAO_CHANNEL_ID:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
      NEXT_PUBLIC_COMMIT_SHA: ${APP_VERSION:-unknown}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - ems_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── AI Engine ─────────────────────────────────────────────
  ai-engine:
    image: ${NCP_REGISTRY}/ems-ai:${APP_VERSION:-latest}
    container_name: ems_ai_engine
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-ems}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-energy}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MQTT_BROKER_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      APP_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ems_net
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M

  # ── Nginx + SSL ───────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ems_nginx
    restart: always
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - ./infra/nginx/logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app1
      - app2
    networks:
      - ems_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Certbot (Let's Encrypt 자동 갱신) ─────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: ems_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - ems_net

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: ems_prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - ems_net

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.0
    container_name: ems_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_DOMAIN: ${NEXTAUTH_URL}
      GF_SERVER_ROOT_URL: "${NEXTAUTH_URL}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: ${GMAIL_USER:-}
      GF_SMTP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SUPPORT_EMAIL:-}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - ems_net

  # ── Exporters (Prometheus 수집용) ─────────────────────────
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.0
    container_name: ems_mysql_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "${MYSQL_USER:-ems}:${MYSQL_PASSWORD}@(mysql:3306)/${MYSQL_DATABASE:-energy}"
    expose:
      - "9104"
    networks:
      - ems_net
    depends_on:
      - mysql

  redis-exporter:
    image: oliver006/redis_exporter:v1.57.0
    container_name: ems_redis_exporter
    restart: always
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "9121"
    networks:
      - ems_net

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: ems_node_exporter
    restart: always
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    pid: host
    network_mode: host

  # ── Cron Runner ───────────────────────────────────────────
  # NCP 서버에서 내부 크론 엔드포인트를 주기적으로 호출하는 경량 컨테이너
  # Alpine + curl 만 사용 (수십 MB)
  cron:
    image: alpine:3.19
    container_name: ems_cron
    restart: always
    environment:
      CRON_SECRET: ${CRON_SECRET}
      APP_INTERNAL_URL: http://app1:3000
    networks:
      - ems_net
    depends_on:
      app1:
        condition: service_healthy
    # crontab 설치 후 실행 (KST = UTC+9)
    command: >
      sh -c "
        apk add --no-cache curl tzdata &&
        cp /usr/share/zoneinfo/Asia/Seoul /etc/localtime &&
        echo 'Asia/Seoul' > /etc/timezone &&

        echo '
        # 형식: 분 시 일 월 요일 커맨드 (KST 기준)

        # 매일 00:10 — 자동 백업
        10 0 * * * curl -sf -H \"Authorization: Bearer $CRON_SECRET\" $APP_INTERNAL_URL/api/cron/backup >> /var/log/cron.log 2>&1

        # 매일 00:30 — 구독 상태 동기화 + 만료 알림
        30 0 * * * curl -sf -H \"Authorization: Bearer $CRON_SECRET\" $APP_INTERNAL_URL/api/cron/subscription-sync >> /var/log/cron.log 2>&1

        # 매일 03:00 — 로그/데이터 보존 정책 정리 (디스크 절약)
        0 3 * * * curl -sf -H \"Authorization: Bearer $CRON_SECRET\" $APP_INTERNAL_URL/api/cron/cleanup-logs >> /var/log/cron.log 2>&1

        # 매일 06:00 — 일일 리포트 생성
        0 6 * * * curl -sf -H \"Authorization: Bearer $CRON_SECRET\" $APP_INTERNAL_URL/api/cron/daily-report >> /var/log/cron.log 2>&1

        # 매 30분 — 알림 체크 (게이트웨이 오프라인, 구독 만료 임박)
        */30 * * * * curl -sf -H \"Authorization: Bearer $CRON_SECRET\" $APP_INTERNAL_URL/api/cron/check-alerts >> /var/log/cron.log 2>&1

        # 매주 월요일 02:00 — 이탈 위험 점수 계산
        0 2 * * 1 curl -sf -H \"Authorization: Bearer $CRON_SECRET\" $APP_INTERNAL_URL/api/cron/churn-score >> /var/log/cron.log 2>&1

        # 매주 일요일 03:00 — 블록체인 토큰 상태 동기화
        0 3 * * 0 curl -sf -H \"Authorization: Bearer $CRON_SECRET\" $APP_INTERNAL_URL/api/cron/sync-blockchain >> /var/log/cron.log 2>&1
        ' | tr -s ' ' | crontab - &&

        crond -f -l 8
      "
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
