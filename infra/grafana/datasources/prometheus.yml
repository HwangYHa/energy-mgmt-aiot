apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: '15s'
      queryTimeout: '60s'
      httpMethod: POST

  - name: MySQL
    type: mysql
    url: mysql:3306
    database: energy
    user: ${MYSQL_USER}
    secureJsonData:
      password: ${MYSQL_PASSWORD}
    editable: false
    jsonData:
      maxOpenConns: 5
      maxIdleConns: 5
      connMaxLifetime: 14400
