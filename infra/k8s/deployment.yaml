# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: energy-platform
  template:
    spec:
      containers:
      - name: api
        image: energy-platform:latest
        env:
        - name: REGION
          value: "ap-northeast-2"  # Seoul
        - name: DB_HOST
          value: "mysql-kr.example.com"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - energy-platform
            topologyKey: "kubernetes.io/hostname"