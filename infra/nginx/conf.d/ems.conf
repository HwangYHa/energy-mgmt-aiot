# ============================================================
# 탄소이음 EMS — 메인 서버 블록
# 도메인: carbonieum.co.kr (도메인 구매 후 활성화)
# 배포 전: DOMAIN 변수를 실제 도메인으로 교체
# ============================================================

# ── HTTP → HTTPS 리디렉션 + ACME challenge ────────────────
server {
    listen 80;
    server_name carbonieum.co.kr www.carbonieum.co.kr;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── IP 직접 접근 차단 (스캐너 방어) ──────────────────────
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/live/carbonieum.co.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/carbonieum.co.kr/privkey.pem;
    return 444;
}

# ── HTTPS 메인 서버 ───────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name carbonieum.co.kr www.carbonieum.co.kr;

    # ── SSL 인증서 (Let's Encrypt) ────────────────────────
    ssl_certificate     /etc/nginx/ssl/live/carbonieum.co.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/carbonieum.co.kr/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/carbonieum.co.kr/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── 보안 헤더 ─────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    # ── 정적 파일 장기 캐싱 (_next/static — 해시 포함) ───
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_cache_valid 200 365d;
    }

    # ── public 폴더 직접 서빙 ────────────────────────────
    location ~* ^/(images|fonts|icons|favicon\.ico|robots\.txt|sitemap\.xml|feed\.xml)$ {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
    }

    # ── Auth 엔드포인트 (엄격한 Rate Limit) ─────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── AI Engine 내부 프록시 ────────────────────────────
    location /api/ai-engine/ {
        limit_req zone=ai_limit burst=10 nodelay;

        rewrite ^/api/ai-engine/(.*) /$1 break;
        proxy_pass http://ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── 일반 API ─────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 메인 앱 ──────────────────────────────────────────
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health Check (NCP LB probe용 — 인증 없음) ────────
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
