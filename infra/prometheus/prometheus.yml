# ============================================================
# Prometheus — EMS AIoT 메트릭 수집
# ============================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ems-aiot'
    env: 'production'

# ── 알람 규칙 파일 ────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# ── Alertmanager 연결 ────────────────────────────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# ── 스크랩 설정 ──────────────────────────────────────────
scrape_configs:
  # Prometheus 자체
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Next.js 앱 (커스텀 /api/metrics 또는 next-prometheus)
  - job_name: 'nextjs'
    static_configs:
      - targets: ['app1:3000', 'app2:3000']
    metrics_path: '/api/metrics'
    bearer_token: '${METRICS_TOKEN}'

  # AI Engine (FastAPI /metrics)
  - job_name: 'ai-engine'
    static_configs:
      - targets: ['ai-engine:8001']
    metrics_path: '/metrics'

  # MySQL (mysqld_exporter)
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

  # Redis (redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Nginx (nginx-prometheus-exporter)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # Node Exporter (호스트 메트릭)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
